<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北疆行程 · 费用管理</title>

<!-- PWA / iOS 添加到主屏幕 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a9d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="北疆行程">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <h1>🏔️ 北疆行程 · 费用管理</h1>
  <div class="tabs">
    <div class="tab on" data-t="days" onclick="tab('days')">📋 每日</div>
    <div class="tab" data-t="cost" onclick="tab('cost')">💰 费用</div>
    <div class="tab" data-t="book" onclick="tab('book')">🏨 预订</div>
    <div class="tab" data-t="split" onclick="tab('split')">💸 分账</div>
  </div>

  <div id="v_days"></div>
  <div id="v_cost" class="hide"></div>
  <div id="v_book" class="hide"></div>
  <div id="v_split" class="hide"></div>
</div>

<div class="toolbar">
  <button class="act b-green" id="btnsync" onclick="syncNow()">☁ 同步</button>
  <!-- 导入导出挪进 ⚙ 了:配了同步之后基本用不上,但功能留着(没网/换手机时还是它最可靠) -->
  <input type="file" id="imp" accept="application/json,.json" style="display:none" onchange="importJSON(event)">
  <button class="act b-gray b-icon" onclick="openSettings()" aria-label="设置">⚙</button>
  <span class="savestate" id="savestate">已自动保存</span>
</div>

<!-- iOS 导出兜底:iOS Safari 不支持 a[download],用这个框让用户长按复制/存文件 -->
<div class="modal hide" id="modal">
  <div class="modalbox">
    <div class="modalhd">
      <b id="modaltitle">存档 JSON</b>
      <span class="del" onclick="closeModal()">✕</span>
    </div>
    <div class="modaltip" id="modaltip"></div>
    <textarea id="modaltext" readonly onclick="this.select()"></textarea>
    <div class="modalbtns">
      <button class="act b-green" onclick="copyModal()">📋 复制全部</button>
      <button class="act b-gray" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 设置:我是谁 + GitHub 同步配置 + 恢复初始数据 -->
<div class="modal hide" id="setmodal">
  <div class="modalbox">
    <div class="modalhd">
      <b>⚙ 设置</b>
      <span class="del" onclick="closeSettings()">✕</span>
    </div>
    <div id="setbody" class="setbody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
<script src="ui.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing;
        if(!nw)return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='installed'&&navigator.serviceWorker.controller){
            toast('有新版本,关掉重开即可更新');
          }
        });
      });
    }).catch(function(){});
  });
}
</script>
</body>
</html>
